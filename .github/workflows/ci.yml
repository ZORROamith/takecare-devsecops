name: Takecare DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit semgrep

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Static application security testing
        run: semgrep scan --config p/django --config p/python doctor lab labs patient pharmacy takecare

      - name: Django configuration check
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DB_NAME: takecare
          DB_USER: takecare_app
          DB_PASSWORD: ci-test-password
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
        run: python manage.py check
